name: ci-backend

# Chạy trên mọi nhánh phát triển + mọi PR vào main/develop. 'feat/**' là để nhánh đang làm
# cũng được kiểm tra trước khi mở PR (nếu thiếu, workflow im lặng không chạy và rất dễ
# tưởng CI hỏng).
on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'Directory.Build.props'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'Directory.Build.props'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

# Đẩy commit tiếp theo lên cùng nhánh/PR ⇒ huỷ run cũ cho khỏi tốn runner.
# `head_ref` (chứ không phải `ref_name`) để tên group không đổi khi nhánh bị rebase;
# `run_id` làm phương án dự phòng cho push trực tiếp.
concurrency:
  group: ci-backend-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test (.NET 10 + PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Khớp đúng major version đã verify ở Phase 7 và trên máy dev (PostgreSQL 18).
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DatabaseFixture đọc biến này, tự `CREATE DATABASE TeamNexus_Test` nếu chưa có rồi tự chạy
      # migration một lần cho cả process ⇒ CI KHÔNG cần tạo DB thủ công và KHÔNG cần `dotnet ef`.
      TEAMNEXUS_TEST_DB: Host=localhost;Port=5432;Database=TeamNexus_Test;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # .NET 10 đã GA ⇒ không cần `dotnet-quality: preview`. Ghim major.minor, KHÔNG dùng 'latest'.
          dotnet-version: '10.0.x'

      # Repo không có packages.lock.json ⇒ `setup-dotnet` với `cache: true` sẽ không tìm thấy lock
      # file và bỏ qua cache. Cache thẳng thư mục NuGet với key băm các .csproj là cách đúng ở đây.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TeamNexus.sln

      # `-m:1` để build tuần tự, tất định và dễ đọc log. KHÔNG dùng `-nr:false` ở đây: cờ đó chỉ
      # cần thiết trong môi trường sandbox/agent (named pipe của MSBuild bị chặn — xem README).
      - name: Build (0 warning / 0 error)
        run: dotnet build TeamNexus.sln --no-restore -m:1 -c Release

      # `-c Release` PHẢI khớp với bước build ở trên, nếu không `--no-build` sẽ không tìm thấy
      # assembly.
      - name: Test
        run: >
          dotnet test tests/TeamNexus.Api.Tests/TeamNexus.Api.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Cổng chống "xanh giả". Một test bị SKIP vẫn tính là xanh, và khi DB không tới được thì
      # DatabaseFixture cố tình bỏ qua cả nhóm test cần DB (Phase 8 D4) — trên CI điều đó KHÔNG
      # bao giờ được phép xảy ra, vì service container ở trên là để bảo đảm có DB thật.
      # Lần chạy CI đầu tiên đã lọt lưới đúng kiểu này: job xanh nhưng chỉ 111/172 test thực sự chạy.
      - name: Assert no test was skipped
        shell: pwsh
        run: |
          [xml]$trx = Get-Content TestResults/test-results.trx
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $counters = Select-Xml -Xml $trx -XPath '//t:ResultSummary/t:Counters' -Namespace $ns
          $total = [int]$counters.Node.total
          $executed = [int]$counters.Node.executed
          $skipped = $total - $executed
          $failed = [int]$counters.Node.failed

          Write-Host "xUnit TRX: total=$total executed=$executed skipped=$skipped failed=$failed"
          if ($skipped -gt 0) {
            throw "Có $skipped test bị SKIP trên CI — DB test không sẵn sàng? Job này chỉ xanh khi MỌI test thực sự chạy."
          }
          if ($total -ne 172) {
            throw "Số test backend đã đổi: $total (kỳ vọng 172). Nếu là chủ ý, cập nhật con số này và tài liệu."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 7
